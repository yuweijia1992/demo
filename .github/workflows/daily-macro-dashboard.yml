name: Daily macro dashboard
on:
  push:
    paths:
      - "scripts/update_macro_dashboard.py"
      - ".github/workflows/daily-macro-dashboard.yml"
  schedule:
    - cron: "25 0 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-macro-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate updater syntax
        run: python -m py_compile scripts/update_macro_dashboard.py
      - name: Fetch public FRED observations
        run: python scripts/update_macro_dashboard.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/macro-dashboard.json; then
            echo "No macro data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro-dashboard.json
          git commit -m "Refresh daily macro dashboard"
          git push
