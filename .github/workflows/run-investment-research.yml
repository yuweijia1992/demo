name: Run Investment Lab research backtests

on:
  push:
    paths:
      - 'scripts/run_investment_research.py'
      - 'scripts/fetch_chinabond_cba00201.py'
      - '.github/workflows/run-investment-research.yml'
      - 'data/investment-monthly.csv'
  workflow_dispatch:

concurrency:
  group: investment-research-backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official ChinaBond composite wealth index (best effort)
        run: python scripts/fetch_chinabond_cba00201.py
      - name: Run reproducible backtest and withdrawal simulations
        run: python scripts/run_investment_research.py
      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/ data/investment-monthly.csv data/sources/
          if git diff --cached --quiet; then
            echo "No research output changes."
          else
            git commit -m "Publish Investment Lab research backtests"
            git pull --rebase origin main
            git push
          fi
