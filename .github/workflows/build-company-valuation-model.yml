name: Build company valuation model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_valuation_model.py"
      - "articles/valuation-engine.html"
      - "data/china-stocks-financial-valuation.json"
      - "data/financial-standardized/**"
      - "data/valuation-history/generated/valuation-monthly.csv"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build auditable model data
        run: python scripts/build_valuation_model.py
      - name: Validate valuation dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.parts=[]; self.current=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script": self.active=True; self.current=[]
              def handle_data(self, data):
                  if self.active: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.active:
                      self.parts.append("".join(self.current)); self.active=False
          p=Scripts(); p.feed(Path("articles/valuation-engine.html").read_text(encoding="utf-8"))
          Path("/tmp/valuation-engine-inline.js").write_text("\\n".join(p.parts),encoding="utf-8")
          assert p.parts, "No inline script found"
          PY
          node --check /tmp/valuation-engine-inline.js
      - name: Validate output and company count
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/valuation-model/valuation-model-49.json",encoding="utf-8"))
          a=json.load(open("data/valuation-model/valuation-model-audit.json",encoding="utf-8"))
          assert p["companyCount"] == 49, p["companyCount"]
          assert len(p["companies"]) == 49
          assert a["masterCompanies"] == 49
          assert all(len(c["annual"]) == 5 for c in p["companies"])
          print("PASS: 49 companies, 5 annual periods, audited valuation model generated")
          PY
      - name: Commit generated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valuation-model/valuation-model-49.json data/valuation-model/valuation-model-audit.json
          git diff --cached --quiet || git commit -m "Build audited 49-company valuation model"
          git push
