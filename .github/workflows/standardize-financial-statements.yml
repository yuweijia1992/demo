name: Standardize company financial statements

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/standardize_financial_statements.py'
      - 'scripts/build_financial_pit_panel.py'
      - '.github/workflows/standardize-financial-statements.yml'

permissions:
  contents: write

concurrency:
  group: standardize-company-financials
  cancel-in-progress: false

jobs:
  standardize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize archived statements
        run: python scripts/standardize_financial_statements.py
      - name: Build announcement-date point-in-time panel audit
        env:
          PUBLIC_DATA_REPUBLISH_LICENSE_APPROVED: ${{ vars.PUBLIC_DATA_REPUBLISH_LICENSE_APPROVED }}
        run: python scripts/build_financial_pit_panel.py
      - name: Validate point-in-time audit
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/financial-standardized/pit-panel-coverage-audit.json",encoding="utf-8"))
          assert p["companyCount"] == 49, p["companyCount"]
          assert p["financialPointInTimeRule"].startswith("Only values with a parsed announcement date")
          assert p["publicPanelExport"] in ("written","blocked_pending_explicit_redistribution_license_approval")
          print("PASS: announcement-date PIT panel audit generated for 49 companies")
          PY
      - name: Upload normalized dataset and audit
        uses: actions/upload-artifact@v4
        with:
          name: standardized-company-financials
          path: data/financial-standardized/
          retention-days: 30
      - name: Commit standardized dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financial-standardized/
          if ! git diff --cached --quiet; then
            git commit -m "Standardize 2021-2025 company financial statements"
            git pull --rebase origin main
            git push
          fi
