name: Refresh public A-share valuation history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/valuation-history/universe.json"
      - "scripts/fetch_eastmoney_a_share_valuation.py"
      - "scripts/fetch_baostock_a_share_valuation.py"
      - "scripts/fetch_baidu_valuation_history.py"
      - "scripts/build_valuation_history.py"
  schedule:
    # Monthly refresh; 17:30 China Standard Time on the 3rd day of each month.
    - cron: "30 9 3 * *"

permissions:
  contents: write

concurrency:
  group: public-a-share-valuation-refresh
  cancel-in-progress: true

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BaoStock public data client
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --disable-pip-version-check baostock

      - name: Retry BaoStock historical valuation backfill (pre-2018) on manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/fetch_baostock_a_share_valuation.py

      - name: Ensure BaoStock input file exists
        run: |
          mkdir -p data/valuation-history/raw
          if [ ! -f data/valuation-history/raw/baostock-pre2018-daily.csv ]; then
            printf 'code,date,close,currency,peTtm,pb,psTtm,source,sourceUrl\n' > data/valuation-history/raw/baostock-pre2018-daily.csv
          fi

      - name: Fetch Baidu public PE/PB history (A shares pre-2018, HK full history)
        run: |
          python scripts/fetch_baidu_valuation_history.py

      - name: Fetch Eastmoney daily valuation history (2018 onward)
        run: |
          python scripts/fetch_eastmoney_a_share_valuation.py

      - name: Build month-end data and strict 5Y/10Y valuation percentiles
        run: |
          python scripts/build_valuation_history.py \
            --input data/valuation-history/raw/baostock-pre2018-daily.csv \
            --input data/valuation-history/raw/baidu-valuation-history.csv \
            --input data/valuation-history/raw/eastmoney-a-share-daily.csv \
            --out-dir data/valuation-history/generated

      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valuation-history/raw data/valuation-history/generated
          if git diff --cached --quiet; then
            echo "No valuation data changes."
          else
            git commit -m "Refresh public A-share valuation history"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Check A-share source coverage
        run: |
          python - <<'PY'
          import json, sys
          with open("data/valuation-history/raw/eastmoney-fetch-audit.json", encoding="utf-8") as f:
              eastmoney = json.load(f)
          with open("data/valuation-history/raw/baostock-fetch-audit.json", encoding="utf-8") as f:
              baostock = json.load(f)
          with open("data/valuation-history/generated/coverage-audit.json", encoding="utf-8") as f:
              coverage = json.load(f)
          with open("data/valuation-history/raw/baidu-fetch-audit.json", encoding="utf-8") as f:
              baidu = json.load(f)
          requested = eastmoney.get("requestedAshareCompanies", 0)
          covered = eastmoney.get("companiesWithData", 0)
          print(f"Eastmoney coverage: {covered}/{requested}; daily rows: {eastmoney.get('dailyRows', 0)}")
          print(f"BaoStock backfill: {baostock.get('companiesWithRows', 0)}/{baostock.get('requestedAshareCompanies', 0)}; daily rows: {baostock.get('dailyRows', 0)}")
          print(f"Baidu supplement: A pre-2018 {baidu.get('aShareCompaniesWithPre2018Data', 0)}, HK {baidu.get('hkCompaniesWithData', 0)}; daily rows: {baidu.get('dailyRowsWritten', 0)}; PE/PB only (no PS)")
          print(f"Monthly rows: {coverage.get('monthlyRowsWritten', 0)}; companies with history: {coverage.get('companiesWithHistory', 0)}")
          print("Latest 5Y/10Y percentile coverage:", coverage.get("latestMonthEndPercentileCoverage", {}))
          for failure in eastmoney.get("failedCompanies", []):
              print("EASTMONEY FAILED:", failure)
          for failure in baostock.get("failedOrEmptyCompanies", []):
              print("BAOSTOCK EMPTY/FAILED:", failure)
          if requested != 44 or covered != requested:
              sys.exit(1)
          PY
