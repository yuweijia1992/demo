name: Inspect public cibo.hk HK valuation history endpoints

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_cibo_hk_valuation.py"
      - ".github/workflows/probe-cibo-hk-valuation.yml"

permissions:
  contents: write

concurrency:
  group: cibo-hk-valuation-discovery
  cancel-in-progress: true

jobs:
  discover-cibo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Inspect HK valuation pages and same-origin JavaScript
        run: |
          python -m py_compile scripts/probe_cibo_hk_valuation.py
          python scripts/probe_cibo_hk_valuation.py --timeout 20 --delay 1

      - name: Commit endpoint discovery audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valuation-history/raw/cibo-hk-page-probe.json
          if git diff --cached --quiet; then
            echo "No changes in cibo endpoint discovery"
          else
            git commit -m "Probe public cibo HK valuation chart endpoints"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
