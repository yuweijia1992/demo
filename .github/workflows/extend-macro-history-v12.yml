name: Extend Macro History V1.2
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/extend_macro_history_v12.py"
      - "scripts/audit_macro_history_v12.py"
      - ".github/workflows/extend-macro-history-v12.yml"
permissions:
  contents: write
jobs:
  download-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download public source files (best effort; preserve partial successes)
        id: download
        continue-on-error: true
        run: python scripts/extend_macro_history_v12.py
      - name: Audit all available source files and build monthly panel
        id: audit
        if: always()
        continue-on-error: true
        run: python scripts/audit_macro_history_v12.py
      - name: Commit source files, audit and panel even when some sources fail
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index-valuation/*.csv data/index-valuation/*.csv.gz data/index-valuation/*.json || true
          if git diff --cached --quiet; then
            echo "No data or audit artifacts to commit."
          else
            git commit -m "Audit V1.2 macro history sources and monthly panel"
            git push
          fi
      - name: Enforce strict V1.2 acceptance gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/index-valuation/v12-historical-data-audit.json")
          if not p.exists():
              raise SystemExit("V1.2 audit JSON was not generated.")
          a=json.loads(p.read_text())
          print(json.dumps(a.get("checks",{}),ensure_ascii=False,indent=2))
          if not a.get("checks",{}).get("strict_v12_pass",False):
              raise SystemExit("V1.2 NOT PASSED: one or more acceptance criteria remain unmet.")
          PY
