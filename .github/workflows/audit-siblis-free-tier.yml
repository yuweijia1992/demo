name: Audit Siblis free index valuation coverage
on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/audit_siblis_free_tier.py"
      - ".github/workflows/audit-siblis-free-tier.yml"
permissions:
  contents: write
concurrency:
  group: siblis-free-tier-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit free API coverage (metadata only)
        run: |
          python -m py_compile scripts/audit_siblis_free_tier.py
          python scripts/audit_siblis_free_tier.py
      - name: Commit coverage audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index-valuation/siblis-free-tier-audit.json
          if git diff --cached --quiet; then echo "No audit changes."; else
            git commit -m "Audit Siblis free index valuation coverage"
            git pull --rebase origin main
            git push origin main
          fi
