name: Build public index valuation history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_public_index_valuations.py"
      - ".github/workflows/build-index-valuations.yml"
      - "data/investment-monthly.csv"
permissions:
  contents: write
concurrency:
  group: index-valuation-history
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and fetch public valuation series
        run: |
          python -m py_compile scripts/fetch_public_index_valuations.py
          python scripts/fetch_public_index_valuations.py
      - name: Commit raw source snapshots and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index-valuation
          if git diff --cached --quiet; then echo "No valuation data changes."; else
            git commit -m "Refresh public index valuation history"
            git pull --rebase origin main
            git push origin main
          fi
