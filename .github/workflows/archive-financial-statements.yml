name: Archive A-share financial statements

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_financial_statements.py'
      - '.github/workflows/archive-financial-statements.yml'
  schedule:
    - cron: "30 2 5 * *"

concurrency:
  group: financial-statement-archive
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data collector
        run: |
          python -m pip install --upgrade pip
          pip install akshare
      - name: Retrieve and archive source statements
        run: python scripts/collect_financial_statements.py
      - name: Audit retrieved statement coverage
        run: python scripts/audit_financial_archive.py
      - name: Commit archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw-financials/
          if ! git diff --cached --quiet; then
            git commit -m "Archive monthly A-share financial statements"
            git push
          fi
