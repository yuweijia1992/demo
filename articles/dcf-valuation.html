<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCF估值｜余暮投资实验室</title><link rel="stylesheet" href="../styles.css"><style>.wrap{max-width:1080px;margin:auto}.hero2{padding:65px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);background:var(--surface);padding:25px}.input{width:100%;box-sizing:border-box;background:transparent;border:1px solid var(--line);padding:9px;color:var(--text);margin:6px 0 14px}.formula{font-family:Georgia,serif;font-size:20px;padding:18px;border-left:3px solid var(--text)}.result{font-size:32px;font-family:Georgia,serif}.muted{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html">余暮<span> / Y.M.</span></a><nav><a href="asset-research.html">研究库</a><a href="dcf-valuation.html">DCF</a><a href="investment-log.html">日志</a></nav><button id="themeToggle" class="theme-btn">◐</button></div></header><main class="container wrap"><section class="hero2"><p class="eyebrow">INVESTMENT SYSTEM · 06</p><h1>DCF估值</h1><p class="lead">DCF不是精确预测未来，而是把增长、利润率、资本开支、折现率和终值假设显性化，然后观察估值对假设的敏感程度。</p></section><section class="section"><div class="panel"><div class="formula">Enterprise Value = Σ FCFₜ / (1+WACC)ᵗ + Terminal Value / (1+WACC)ⁿ</div><p class="muted">终值可用永续增长法：TV = FCFₙ₊₁ / (WACC − g)。</p></div></section><section class="section"><div class="grid"><div class="panel"><h2>输入</h2><label>当前自由现金流（万元）<input id="fcf" class="input" type="number" value="10000"></label><label>未来5年增长率<input id="g" class="input" type="number" value="8" step=".1"></label><label>WACC<input id="wacc" class="input" type="number" value="8" step=".1"></label><label>永续增长率<input id="tg" class="input" type="number" value="3" step=".1"></label><label>净债务（万元）<input id="debt" class="input" type="number" value="0"></label><label>总股本（万股）<input id="shares" class="input" type="number" value="10000"></label></div><div class="panel"><h2>结果</h2><p class="muted">估算企业价值</p><div id="ev" class="result">—</div><p class="muted">估算股权价值 / 每股</p><div id="eq" class="result">—</div><p class="muted">这只是数学模型输出，不是投资建议。</p></div></div></section></main><footer class="footer container"><span>© 2026 余暮 · Investment Lab</span><span><a href="investment-lab.html">← 返回实验室</a></span></footer><script src="../script.js"></script><script>const ids=["fcf","g","wacc","tg","debt","shares"];ids.forEach(id=>document.getElementById(id).oninput=calc);function calc(){let f=+fcf.value,gr=+g.value/100,w=+wacc.value/100,tg0=+tg.value/100,d=+debt.value,s=+shares.value;if(w<=tg0||!s){ev.textContent="参数无效";eq.textContent="—";return}let pv=0,cf=f;for(let t=1;t<=5;t++){cf*=1+gr;pv+=cf/Math.pow(1+w,t)}let tv=cf*(1+tg0)/(w-tg0),enterprise=pv+tv/Math.pow(1+w,5),equity=enterprise-d;document.getElementById("ev").textContent=enterprise.toLocaleString("zh-CN",{maximumFractionDigits:0})+" 万元";document.getElementById("eq").textContent=(equity/s).toFixed(2)+" 元/股"}calc();</script></body></html>
