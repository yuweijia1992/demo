<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投资日志｜余暮投资实验室</title><link rel="stylesheet" href="../styles.css"><style>.wrap{max-width:1080px;margin:auto}.hero2{padding:65px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);background:var(--surface);padding:25px}.input,textarea{width:100%;box-sizing:border-box;background:transparent;border:1px solid var(--line);padding:10px;color:var(--text);margin:6px 0 14px}textarea{min-height:100px}.btn2{border:1px solid var(--text);background:var(--text);color:var(--bg);padding:10px 16px;cursor:pointer}.entry{border-top:1px solid var(--line);padding:20px 0}.entry small{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html">余暮<span> / Y.M.</span></a><nav><a href="asset-research.html">研究库</a><a href="investment-log.html">日志</a><a href="annual-review.html">复盘</a></nav><button id="themeToggle" class="theme-btn">◐</button></div></header><main class="container wrap"><section class="hero2"><p class="eyebrow">INVESTMENT SYSTEM · 07</p><h1>投资日志</h1><p class="lead">交易不是结论，记录才是可复盘的证据。每次行动都写下“为什么现在做、什么情况证明我错了”。数据保存在当前浏览器本地。</p></section><section class="section"><div class="grid"><div class="panel"><h2>新增记录</h2><label>日期<input id="date" class="input" type="date"></label><label>资产<input id="asset" class="input" placeholder="例如：长江电力"></label><label>动作<input id="action" class="input" placeholder="买入 / 加仓 / 减仓 / 卖出"></label><label>价格 / 金额<input id="amount" class="input" placeholder="价格、金额或仓位"></label><label>投资逻辑<textarea id="thesis" placeholder="为什么现在做？"></textarea></label><label>风险与错误条件<textarea id="risk" placeholder="什么情况出现时，你会承认判断错误？"></textarea></label><button class="btn2" id="save">保存记录</button></div><div class="panel"><h2>历史记录</h2><div id="list" class="muted">暂无记录</div><button class="btn2" id="clear" style="margin-top:15px">清空本地记录</button></div></div></section></main><footer class="footer container"><span>© 2026 余暮 · Investment Lab</span><span><a href="investment-lab.html">← 返回实验室</a></span></footer><script src="../script.js"></script><script>date.value=new Date().toISOString().slice(0,10);function get(){return JSON.parse(localStorage.getItem("ym_invest_log")||"[]")}function show(){const a=get();list.innerHTML=a.length?a.slice().reverse().map(x=>'<div class="entry"><small>'+x.date+' · '+x.asset+' · '+x.action+' · '+x.amount+'</small><p>'+x.thesis+'</p><p class="muted">错误条件：'+x.risk+'</p></div>').join(""):"暂无记录"}save.onclick=()=>{const a=get();a.push({date:date.value,asset:asset.value,action:action.value,amount:amount.value,thesis:thesis.value,risk:risk.value});localStorage.setItem("ym_invest_log",JSON.stringify(a));asset.value=action.value=amount.value=thesis.value=risk.value="";show()};clear.onclick=()=>{localStorage.removeItem("ym_invest_log");show()};show();</script></body></html>
