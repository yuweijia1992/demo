<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风险监控｜余暮投资实验室</title><link rel="stylesheet" href="../styles.css"><style>.wrap{max-width:1080px;margin:auto}.hero2{padding:65px 0}.risk{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.panel{border:1px solid var(--line);background:var(--surface);padding:25px}.panel h2{font-family:Georgia,"Songti SC",serif;font-weight:500}.check{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}.check input{margin-top:5px}.muted{color:var(--muted)}@media(max-width:700px){.risk{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html">余暮<span> / Y.M.</span></a><nav><a href="investment-dashboard.html">仪表盘</a><a href="risk-monitor.html">风险</a><a href="annual-review.html">复盘</a></nav><button id="themeToggle" class="theme-btn">◐</button></div></header><main class="container wrap"><section class="hero2"><p class="eyebrow">INVESTMENT SYSTEM · 08</p><h1>风险监控</h1><p class="lead">风险监控同时读取仪表盘的宏观状态、资产评分和组合偏离。勾选项保存在浏览器本地。</p><div id="auto" class="panel" style="margin-top:20px"><strong>自动风险提示：</strong>读取中……</div></section><section class="section"><div class="risk"><div class="panel"><h2>组合风险</h2><div id="a"></div></div><div class="panel"><h2>宏观风险</h2><div id="b"></div></div><div class="panel"><h2>行为风险</h2><div id="c"></div></div><div class="panel"><h2>资产风险</h2><div id="d"></div></div></div></section></main><footer class="footer container"><span>© 2026 余暮 · Investment Lab</span><span><a href="investment-lab.html">← 返回实验室</a></span></footer><script src="../script.js"></script><script>const groups={a:["单一资产权重是否过高","股票总仓位是否超过风险承受能力","现金流是否覆盖未来1年以上支出","组合是否出现明显相关性上升"],b:["通胀是否重新上行","实际利率是否快速上升","美元流动性是否明显收紧","衰退/信用风险是否快速恶化"],c:["是否因为上涨追高","是否因为下跌恐慌卖出","是否频繁修改长期规则","是否因为短期新闻改变长期判断"],d:["核心投资逻辑是否改变","盈利/现金流是否恶化","估值是否远超历史与基本面合理区间","是否出现无法解释的重大治理风险"]};for(const k in groups){document.getElementById(k).innerHTML=groups[k].map((x,i)=>'<label class="check"><input type="checkbox" data-key="'+k+i+'"><span>'+x+'</span></label>').join("")}document.querySelectorAll("input[data-key]").forEach(x=>{x.checked=localStorage.getItem("ym_risk_"+x.dataset.key)==="1";x.onchange=()=>localStorage.setItem("ym_risk_"+x.dataset.key,x.checked?"1":"0")});</script><script>
const regime=localStorage.getItem("ym_regime")||"未知",signal=localStorage.getItem("ym_signal")||"未知",scores=JSON.parse(localStorage.getItem("ym_scores")||"null");
let alerts=[];
if(regime.includes("滞胀")||regime.includes("通胀")) alerts.push("通胀/能源压力：检查股票估值、长久期债券与黄金配置。");
if(regime.includes("偏紧")) alerts.push("金融条件偏紧：避免因短期下跌改变长期战略，但应检查新增资金节奏。");
if(scores&&scores.gold>=70) alerts.push("黄金评分较高：优先检查黄金是否已经超过战略上限，而不是继续追涨。");
document.getElementById("auto").innerHTML='<strong>自动风险提示：</strong>'+(alerts.length?alerts.join(" · "):"暂无自动触发项。")+'<br><span class="muted">当前状态：'+regime+'；动作：'+signal+'</span>';
</script></body></html>
