<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年度复盘｜余暮投资实验室</title><link rel="stylesheet" href="../styles.css"><style>.wrap{max-width:1080px;margin:auto}.hero2{padding:65px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.panel{border:1px solid var(--line);background:var(--surface);padding:25px}.input,textarea{width:100%;box-sizing:border-box;background:transparent;border:1px solid var(--line);padding:10px;color:var(--text);margin:6px 0 14px}textarea{min-height:120px}.muted{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html">余暮<span> / Y.M.</span></a><nav><a href="investment-lab.html">实验室</a><a href="investment-log.html">日志</a><a href="risk-monitor.html">风险</a></nav><button id="themeToggle" class="theme-btn">◐</button></div></header><main class="container wrap"><section class="hero2"><p class="eyebrow">INVESTMENT SYSTEM · 09</p><h1>年度复盘</h1><p class="lead">一年一次，把收益拆成资产配置、估值、选股、择时和运气；把“结果好不好”与“决策过程是否正确”分开。</p></section><section class="section"><div class="grid"><div class="panel"><h2>量化复盘</h2><label>期初资产<input id="start" class="input" type="number"></label><label>期末资产<input id="end" class="input" type="number"></label><label>年度净投入<input id="flow" class="input" type="number" value="0"></label><p>简化收益率：<strong id="ret">—</strong></p><p class="muted">这里只是近似口径；正式复盘应使用时间加权收益率/IRR。</p></div><div class="panel"><h2>定性复盘</h2><label>今年做对了什么<textarea id="good"></textarea></label><label>今年做错了什么<textarea id="bad"></textarea></label><label>哪些判断被事实推翻<textarea id="wrong"></textarea></label><label>明年唯一最重要的改进<textarea id="next"></textarea></label><button id="save" class="btn btn-primary">保存到本地</button></div></div></section><section class="section"><div class="panel"><h2>复盘原则</h2><p class="muted">不要因为赚钱就认为判断正确，也不要因为亏钱就认为判断错误。评价的是：信息是否充分、逻辑是否一致、估值是否合理、风险是否可承受、执行是否纪律化。</p></div></section></main><footer class="footer container"><span>© 2026 余暮 · Investment Lab</span><span><a href="investment-lab.html">← 返回实验室</a></span></footer><script src="../script.js"></script><script>function calc(){const s=+start.value,e=+end.value,f=+flow.value;ret.textContent=s?(((e-s-f)/s)*100).toFixed(2)+"%":"—"}[start,end,flow].forEach(x=>x.oninput=calc);["start","end","flow","good","bad","wrong","next"].forEach(id=>{document.getElementById(id).value=localStorage.getItem("ym_review_"+id)||"";document.getElementById(id).oninput=()=>localStorage.setItem("ym_review_"+id,document.getElementById(id).value)});calc();</script></body></html>
