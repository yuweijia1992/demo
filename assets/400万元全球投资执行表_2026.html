<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>400万元全球投资执行表 2026｜余暮</title>
<style>
body{margin:0;background:#f5f4ef;color:#171715;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:820px;margin:10vh auto;padding:40px 28px;background:#fff;border:1px solid #ddd9cf;box-shadow:0 24px 60px rgba(30,28,20,.07)}h1{font-family:Georgia,"Songti SC",serif;font-weight:500;font-size:42px;margin:0 0 16px}p{color:#77746c;line-height:1.9}.btn{display:inline-block;margin-top:18px;padding:12px 22px;background:#20201c;color:#f5f4ef;text-decoration:none;border-radius:999px;font-size:14px;cursor:pointer;border:0}.back{display:inline-block;margin-top:24px;color:#77746c;text-decoration:none;font-size:13px}.status{margin-top:14px;font-size:12px;color:#77746c}</style>
</head>
<body><main>
<p>2026 · GLOBAL INVESTMENT EXECUTION PLAN</p>
<h1>400万元全球投资执行表</h1>
<p>这是投资栏目配套的全球资产配置执行表。点击按钮即可下载原始 Excel 文件。</p>
<button class="btn" id="download">下载 Excel 表格 →</button>
<div class="status" id="status">正在准备下载文件…</div>
<br><a class="back" href="../index.html#investment">← 返回投资栏目</a>
</main>
<script>
const parts=[1,2,3,4,5,6,7,8];
const base='400w-2026-xlsx-part';
async function getFile(){
  const texts=await Promise.all(parts.map(i=>fetch(`${base}${i}.txt`).then(r=>{if(!r.ok)throw new Error('读取文件失败');return r.text()})));
  return texts.join('');
}
function base64ToBytes(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes;}
document.getElementById('download').addEventListener('click',async()=>{const status=document.getElementById('status');try{status.textContent='正在生成 Excel 文件…';const b64=await getFile();const blob=new Blob([base64ToBytes(b64)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='400万元全球投资执行表_2026.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='下载已开始。';}catch(e){status.textContent='下载失败，请刷新页面后重试。';}});
getFile().then(()=>document.getElementById('status').textContent='文件已准备就绪。').catch(()=>document.getElementById('status').textContent='点击下载时将重新读取文件。');
</script></body></html>
